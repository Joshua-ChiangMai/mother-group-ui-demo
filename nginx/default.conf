server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets for faster delivery behind Coolify's reverse proxy
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Vite emits hashed filenames under /assets — safe to cache long-term
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router (BrowserRouter): serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
